<script>
// ══════════════════════════════════════════════════
//  AGA — Cliente JS  |  v2.0
// ══════════════════════════════════════════════════

let CONFIG = null, INV_DATA = [], INV_FILTRO = 'activos';
let FICHA_VEH = null, CAJA_TAB = 'general', dashLoaded = false;
// Wrap in try-catch: si localStorage tiene JSON inválido de versión anterior, no crashea
let UI_CFG = {};
try { UI_CFG = JSON.parse(localStorage.getItem('aga_ui')||'{}'); } catch(e) { UI_CFG = {}; localStorage.removeItem('aga_ui'); }

// ── Navegación ───────────────────────────────────
function navigate(page) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelectorAll('.nav-link,.bnav').forEach(l=>l.classList.toggle('active',l.dataset.page===page));
  document.getElementById('navLinks').classList.remove('open');
  if (page==='dashboard')  loadDashboard();
  if (page==='inventario') loadInventario(INV_FILTRO);
  if (page==='caja')       { initCajaMes(); loadCajaTab(CAJA_TAB); loadBalances(); }
  if (page==='config')     initConfigPage();
  if (page==='reportes')   loadReportes();
}
function toggleMenu(){ document.getElementById('navLinks').classList.toggle('open'); }

document.addEventListener('DOMContentLoaded', () => {
  applyStoredUI();
  google.script.run.withSuccessHandler(c=>{CONFIG=c;}).getConfigListas();
  loadDashboard();
  // Optional chaining: no crashea si algún elemento no existe todavía
  document.getElementById('ref-overlay')?.addEventListener('click', cerrarRef);
  document.addEventListener('input', moneyInput, true);
});

let ENTIDAD_ACTUAL = 'AGA'; // AGA o Martin

function setEntidad(e){
  ENTIDAD_ACTUAL = e;
  document.querySelectorAll('.etog').forEach(b=>b.classList.remove('active'));
  document.getElementById('etog-'+e)?.classList.add('active');
  loadCajaTab(CAJA_TAB);
  loadBalances();
}

// ── Money formatting (real-time mientras se escribe) ──
function moneyInput(e) {
  if (!e.target.classList.contains('money') || e.target.readOnly) return;
  const el = e.target;
  const digits = el.value.replace(/\D/g, '');
  if (!digits) { el.value = ''; el.dataset.raw = 0; return; }
  const num = parseInt(digits, 10);
  el.dataset.raw = num;
  const formatted = '$ ' + new Intl.NumberFormat('es-AR').format(num);
  el.value = formatted;
  try { el.setSelectionRange(formatted.length, formatted.length); } catch(_) {}
}
function moneyVal(id) {
  const el = document.getElementById(id); if(!el) return 0;
  return parseFloat(el.dataset.raw||String(el.value).replace(/[^\d.-]/g,''))||0;
}
function setMoney(id, val) {
  const el = document.getElementById(id); if(!el) return;
  const num = parseInt(val)||0;
  el.dataset.raw = num;
  el.value = num ? '$ '+new Intl.NumberFormat('es-AR').format(num) : '';
}

// ── Validation system ────────────────────────────
function validateForm(rules) {
  let ok = true;
  rules.forEach(({id,label,required,min,minVal}) => {
    const el = document.getElementById(id); if(!el) return;
    const val = el.classList.contains('money') ? moneyVal(id) : el.value?.trim();
    let err = '';
    if (required && (val===''||val===null||val===undefined||val===0)) err = `${label} es requerido`;
    if (!err && min !== undefined && String(val).length < min) err = `${label} es muy corto`;
    if (!err && minVal !== undefined && Number(val) < minVal) err = `${label} debe ser mayor a ${minVal}`;
    setFieldError(id, err);
    if (err) ok = false;
  });
  return ok;
}
function setFieldError(id, err) {
  const el = document.getElementById(id); if(!el) return;
  el.classList.toggle('field-invalid', !!err);
  let errEl = el.parentNode.querySelector('.field-error');
  if (err) {
    if (!errEl) { errEl = document.createElement('div'); errEl.className='field-error'; el.parentNode.appendChild(errEl); }
    errEl.textContent = err;
  } else if (errEl) errEl.remove();
}
function clearFieldErrors() {
  document.querySelectorAll('.field-invalid').forEach(el => el.classList.remove('field-invalid'));
  document.querySelectorAll('.field-error').forEach(el => el.remove());
}

// ── Confirmation modal ───────────────────────────
let _confirmCb = null;
function showConfirm(titulo, mensaje, btnLabel, cb, tipo='warn') {
  _confirmCb = cb;
  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-head"><div class="modal-title">${titulo}</div>
      <button class="btn-close" onclick="cerrarModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body"><div class="confirm-box confirm-${tipo}">
      <div class="confirm-icon">${tipo==='err'?'⚠️':'❓'}</div>
      <div style="font-size:14px;color:var(--t1);line-height:1.5">${mensaje}</div>
    </div></div>
    <div class="modal-foot"><button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="${tipo==='err'?'btn-danger':'btn-primary'}" onclick="_runConfirm()">${btnLabel}</button>
    </div>`;
  abrirModal();
  return false; // permite: if(!showConfirm(...)) return;
}
function _runConfirm(){ cerrarModal(); if(_confirmCb){_confirmCb();_confirmCb=null;} }

// ── Saldos sub-caja ──────────────────────────────
let SALDOS = {};
function loadBalances() {
  google.script.run.withSuccessHandler(s => {
    if (!s?.ok) return;
    SALDOS = s;
    document.getElementById('bal-ars').textContent = fmtARS(s.saldoARS);
    document.getElementById('bal-ars').className = s.saldoARS>=0?'caja-saldo-pos':'caja-saldo-neg';
    document.getElementById('bal-usd').textContent = s.posUSD.toFixed(2)+' USD';
    document.getElementById('bal-usd-ars').textContent = '≈ '+fmtARS(s.saldoUSD_ars);
    document.getElementById('bal-chq').textContent = fmtARS(s.chequesEnCartera);
    const total = s.saldoARS + s.saldoUSD_ars + s.chequesEnCartera;
    document.getElementById('bal-total').textContent = fmtARS(total);
    document.getElementById('bal-total').className = total>=0?'caja-saldo-pos':'caja-saldo-neg';
  }).getSaldosSubCaja(ENTIDAD_ACTUAL);
}

// ══════════════════════════════════════════════════
//  DASHBOARD
// ══════════════════════════════════════════════════
function loadDashboard() {
  if (dashLoaded) return;
  google.script.run.withSuccessHandler(renderDashboard)
    .withFailureHandler(()=>renderDashboard({ok:true,enStock:0,reservados:0,consignas:0,ventasMes:0,gananciaMes:0,saldoCaja:0,chequesPorVencer:[],tcBlue:0,ventasRecientes:[],mes:'Dashboard'}))
    .getDashboardData();
}
function renderDashboard(d) {
  if (!d?.ok) return;
  dashLoaded = true;
  // Null-safe: if elements don't exist (race condition or old cache), don't crash
  const dashMes=document.getElementById('dash-mes'); if(dashMes)dashMes.textContent=cap(d.mes||'Dashboard');
  const tp=document.getElementById('tc-pill');
  if(d.tcBlue&&tp){const tv=document.getElementById('tc-val');if(tv)tv.textContent=fmt(d.tcBlue);tp.style.display='';}
  else if(tp)tp.style.display='none';

  const kpiGrid=document.getElementById('kpi-grid'); if(kpiGrid) kpiGrid.innerHTML = `
    <div class="kpi-card"><div class="kpi-lbl">Stock disponible</div><div class="kpi-val a">${d.enStock}</div>
      <div class="kpi-sub">${d.reservados} reservados · ${d.consignas} consignas</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Ventas del mes</div><div class="kpi-val">${d.ventasMes}</div>
      <div class="kpi-sub">vehículos vendidos</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Ganancia del mes</div><div class="kpi-val s">${fmtARS(d.gananciaMes)}</div>
      <div class="kpi-sub">resultado operativo</div></div>
    <div class="kpi-card"><div class="kpi-lbl">Saldo en caja</div><div class="kpi-val">${fmtARS(d.saldoCaja)}</div>
      <div class="kpi-sub">efectivo disponible</div></div>`;

  const alertas = [];
  (d.chequesPorVencer||[]).forEach(ch=>alertas.push(`<div class="alert-card ${ch.dias<=5?'e':'w'}"><strong>Cheque #${ch.numero} vence en ${ch.dias}d</strong><span>${ch.librador} · ${ch.banco} · ${fmtARS(ch.importe)}</span></div>`));
  const alertasWrap=document.getElementById('alertas-wrap');
  if(alertasWrap)alertasWrap.innerHTML=alertas.length?`<p class="section-title" style="margin-bottom:10px">Alertas</p>${alertas.join('')}<div style="height:16px"></div>`:'';
  const vw=document.getElementById('ventas-wrap');
  if(vw&&(d.ventasRecientes||[]).length>0) {
    vw.innerHTML=`<p class="section-title" style="margin-bottom:10px">Últimas ventas</p>`+
      d.ventasRecientes.map(v=>`<div class="venta-row"><div class="venta-ico">🚗</div>
        <div class="venta-info"><div class="venta-v">${v.vehiculo}</div><div class="venta-c">${v.comprador||'—'}</div></div>
        <div class="venta-amt"><div class="venta-p">${fmtARS(v.precio)}</div><div class="venta-g">+${fmtARS(v.ganancia)}</div></div>
        <div class="venta-f">${v.fecha}</div></div>`).join('');
  } else if(vw) vw.innerHTML='';
}

// ══════════════════════════════════════════════════
//  INVENTARIO
// ══════════════════════════════════════════════════
function loadInventario(f) {
  INV_FILTRO=f||'activos';
  document.getElementById('inv-tbody').innerHTML=`<tr><td colspan="7" class="empty-row">Cargando...</td></tr>`;
  document.getElementById('inv-sub').textContent=({activos:'Activos',stock:'En stock',reservado:'Reservados',consigna:'Consignas',vendidos:'Vendidos'})[INV_FILTRO]||'';
  google.script.run.withSuccessHandler(data=>{INV_DATA=data;renderTabla();}).withFailureHandler(()=>toast('Error','err')).getVehiculos(INV_FILTRO);
}
function filtrarInv(btn,f){document.querySelectorAll('.filter-tabs .ftab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadInventario(f);}
function filtrarTabla(){const q=document.getElementById('inv-search').value.toLowerCase();renderTabla(q?INV_DATA.filter(v=>`${v.dominio} ${v.marca} ${v.modelo} ${v.ex_dueno_nombre} ${v.ex_dueno_apellido}`.toLowerCase().includes(q)):INV_DATA);}

function renderTabla(data){
  const rows=data||INV_DATA, tbody=document.getElementById('inv-tbody');
  if(!rows.length){tbody.innerHTML=`<tr><td colspan="7" class="empty-row">Sin vehículos</td></tr>`;return;}
  const isAdmin=USER.role==='admin';
  const cols=UI_CFG.cols_inv||{dominio:1,vehiculo:1,tipo:1,estado:1,costo:1,dias:1};
  tbody.innerHTML=rows.map(v=>`<tr onclick="abrirFicha('${v.id}')">
    ${cols.dominio!==false?`<td><strong>${v.dominio}</strong></td>`:''}
    ${cols.vehiculo!==false?`<td>${v.marca} ${v.modelo} ${v.anio}</td>`:''}
    ${cols.tipo!==false?`<td><span class="badge badge-${v.tipo.toLowerCase()}">${v.tipo}</span></td>`:''}
    ${cols.estado!==false?`<td><span class="badge badge-${v.estado.toLowerCase()}">${v.estado}</span></td>`:''}
    ${cols.costo!==false?`<td class="num">${fmtARS(v.costo_total)}</td>`:''}
    ${cols.dias!==false?`<td class="num"><span class="${diasClass(v.dias_stock)}">${v.dias_stock}d</span></td>`:''}
    <td onclick="event.stopPropagation()">
      <div class="row-actions">
        <button class="btn-ico" onclick="abrirFicha('${v.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        ${isAdmin?`<button class="btn-ico" onclick="abrirEditarVehiculo('${v.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="btn-ico danger" onclick="eliminarVehiculo('${v.id}','${v.dominio}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>`:''}
      </div>
    </td></tr>`).join('');
}
function diasClass(d){return d<30?'dias-ok':d<60?'dias-warn':'dias-err';}

// ── Ficha ──────────────────────────────────────
function abrirFicha(id){
  document.getElementById('ficha-inner').innerHTML=`<div style="padding:80px 20px;text-align:center;color:var(--t3)">Cargando...</div>`;
  document.getElementById('ficha-overlay').classList.add('open');
  document.getElementById('ficha-panel').classList.add('open');
  document.body.style.overflow='hidden';
  google.script.run.withSuccessHandler(renderFicha).withFailureHandler(()=>toast('Error','err')).getVehiculoDetalle(id);
}
function cerrarFicha(e){if(e&&e.target!==document.getElementById('ficha-overlay'))return;_cerrarFicha();}
function _cerrarFicha(){document.getElementById('ficha-overlay').classList.remove('open');document.getElementById('ficha-panel').classList.remove('open');document.body.style.overflow='';FICHA_VEH=null;}

function renderFicha(res){
  if(!res?.ok){toast('Error','err');return;}
  FICHA_VEH=res.vehiculo;
  const v=res.vehiculo,gastos=res.gastos||[];
  const totalGastos=gastos.reduce((s,g)=>s+g.importe_ars,0);
  const isAdmin=USER.role==='admin', canSell=USER.role!=='dueno';
  const exDueno=[v.ex_dueno_nombre,v.ex_dueno_apellido].filter(Boolean).join(' ');

  document.getElementById('ficha-inner').innerHTML=`
    <div class="ficha-head">
      <div class="ficha-head-top">
        <div><div class="ficha-dominio">${v.dominio}</div><div class="ficha-modelo">${v.marca} ${v.modelo} ${v.anio}</div></div>
        <button class="btn-close" onclick="_cerrarFicha()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="ficha-badges">
        <span class="badge badge-${v.tipo.toLowerCase()}">${v.tipo}</span>
        <span class="badge badge-${v.estado.toLowerCase()}">${v.estado}</span>
        ${exDueno?`<span class="badge" style="background:#f3f4f6;color:var(--t2)">👤 ${exDueno}${v.ex_dueno_tel?' · 📞 '+v.ex_dueno_tel:''}</span>`:''}
      </div>
    </div>
    <div class="ficha-body">
      <div class="ficha-tabs">
        <button class="ficha-tab active" onclick="switchFichaTab(this,'info')">Información</button>
        <button class="ficha-tab" onclick="switchFichaTab(this,'gastos')">Gastos (${gastos.length})</button>
      </div>
      <div id="ftab-info">
        <div class="info-grid">
          ${v.tipo!=='OKM'?`<div class="info-item"><div class="info-lbl">Precio de toma</div><div class="info-val">${fmtARS(v.precio_toma)}</div></div>`:''}
          ${v.tipo==='OKM'?`<div class="info-item"><div class="info-lbl">Precio de compra</div><div class="info-val">${fmtARS(v.precio_toma)}</div></div>`:''}
          ${v.precio_tabla&&v.tipo==='Usado'?`<div class="info-item"><div class="info-lbl">Tabla</div><div class="info-val">${fmtARS(v.precio_tabla)} <small style="color:var(--t3)">(${pct(v.precio_toma,v.precio_tabla)}%)</small></div></div>`:''}
          ${v.tipo==='Consigna'&&v.markup_consigna?`<div class="info-item"><div class="info-lbl">Markup</div><div class="info-val">${((v.markup_consigna-1)*100).toFixed(0)}%</div></div>`:''}
          <div class="info-item"><div class="info-lbl">Gastos acumulados</div><div class="info-val">+ ${fmtARS(totalGastos)}</div></div>
          <div class="info-item accent"><div class="info-lbl">Costo total</div><div class="info-val">${fmtARS(v.costo_total)}</div></div>
          <div class="info-item"><div class="info-lbl">Fecha ingreso</div><div class="info-val">${v.fecha_ingreso||'—'}</div></div>
        </div>
        ${v.observaciones?`<div class="info-item full" style="margin-bottom:14px"><div class="info-lbl">Observaciones</div><div style="font-size:13px;color:var(--t2);margin-top:4px">${v.observaciones}</div></div>`:''}
        ${canSell||isAdmin?`<div class="ficha-actions">
          ${v.estado!=='Vendido'?`
            ${canSell?`<button class="btn-primary" onclick="abrirVentaDesde('${v.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/></svg>Registrar venta</button>`:''}
            ${isAdmin&&v.estado==='Stock'?`<button class="btn-secondary" onclick="cambiarEstado('${v.id}','Reservado')">Reservar</button>`:''}
            ${isAdmin&&v.estado==='Reservado'?`<button class="btn-secondary" onclick="cambiarEstado('${v.id}','Stock')">← Stock</button>`:''}
          `:`<span style="color:var(--ok);font-weight:600">✓ Vendido</span>`}
          ${isAdmin?`<button class="btn-secondary" onclick="abrirEditarVehiculo('${v.id}')">Editar</button>
          <button class="btn-danger" onclick="eliminarVehiculo('${v.id}','${v.dominio}')">Eliminar</button>`:''}
        </div>`:''}
      </div>
      <div id="ftab-gastos" style="display:none">
        ${isAdmin?`<button class="btn-primary" style="margin-bottom:12px;width:100%" onclick="abrirGastoDesdeVeh('${v.id}','${v.dominio}')">+ Agregar gasto</button>`:''}
        ${!gastos.length?`<p style="text-align:center;color:var(--t3);padding:24px 0">Sin gastos</p>`
          :gastos.map(g=>`<div class="gasto-row">
            <div><span class="gasto-cat">${g.categoria}</span><div style="font-size:10px;color:var(--t3);margin-top:2px">${g.fecha}</div></div>
            <div class="gasto-desc"><strong>${g.descripcion||'—'}</strong><span>${g.proveedor||''}</span></div>
            <div style="text-align:right"><div class="gasto-amt">${fmtARS(g.importe_ars)}</div></div>
            ${isAdmin?`<button class="btn-ico danger" onclick="eliminarGasto('${g.id}','${v.id}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>`:''}
          </div>`).join('')}
        ${gastos.length?`<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bord);margin-top:8px"><span style="font-size:13px;font-weight:600;color:var(--t2)">Total gastos</span><span style="font-size:14px;font-weight:700">${fmtARS(totalGastos)}</span></div>`:''}
      </div>
    </div>`;
}
function switchFichaTab(btn,tab){document.querySelectorAll('.ficha-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('ftab-info').style.display=tab==='info'?'':'none';document.getElementById('ftab-gastos').style.display=tab==='gastos'?'':'none';}
function cambiarEstado(id,est){google.script.run.withSuccessHandler(r=>{if(r.ok){toast('Estado actualizado','ok');abrirFicha(id);loadInventario(INV_FILTRO);}}).cambiarEstadoVehiculo(id,est);}
function eliminarGasto(id,idVeh){if(!confirm('¿Eliminar?'))return;google.script.run.withSuccessHandler(r=>{if(r.ok){toast('Eliminado','ok');abrirFicha(idVeh);}}).deleteGastoVehiculo(id,idVeh);}
function eliminarVehiculo(id,dom){if(!confirm(`¿Eliminar ${dom}?`))return;google.script.run.withSuccessHandler(r=>{if(r.ok){toast('Eliminado','ok');_cerrarFicha();loadInventario(INV_FILTRO);dashLoaded=false;}}).deleteVehiculo(id);}

// Registrar venta desde ficha (abre wizard pre-cargado con venta_auto)
function abrirVentaDesde(idVeh){
  _cerrarFicha();
  navigate('caja');
  setTimeout(()=>abrirWizard('ingreso','venta_auto',idVeh),150);
}

// Agregar gasto desde ficha (abre wizard pre-cargado con gasto_auto)
function abrirGastoDesdeVeh(idVeh,dom){
  _cerrarFicha();
  navigate('caja');
  setTimeout(()=>abrirWizard('egreso','gasto_auto',idVeh),150);
}

// ── Modal vehiculo ─────────────────────────────
function abrirNuevoVehiculo(){ abrirModalVehiculo(null); }
function abrirEditarVehiculo(id){const v=(FICHA_VEH&&FICHA_VEH.id===id)?FICHA_VEH:(INV_DATA.find(x=>x.id===id)||null);abrirModalVehiculo(v);}

function abrirModalVehiculo(v){
  const isEdit=!!v,tipo=v?.tipo||'Usado',hoy=new Date().toISOString().slice(0,10);
  const marcas=CONFIG?.marcas||[];
  const marcaOpts=marcas.map(m=>`<option ${(v?.marca||'').toUpperCase()===m?'selected':''}>${m}</option>`).join('');
  document.getElementById('modal-inner').innerHTML=`
    <div class="modal-head"><div class="modal-title">${isEdit?'Editar':'Nuevo'} vehículo</div>
      <button class="btn-close" onclick="cerrarModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      ${!isEdit?`<div class="tipo-selector"><button class="tipo-btn ${tipo==='Usado'?'active':''}" onclick="selTipo(this,'Usado')">🚗 Usado</button><button class="tipo-btn ${tipo==='OKM'?'active':''}" onclick="selTipo(this,'OKM')">✨ OKM</button><button class="tipo-btn ${tipo==='Consigna'?'active':''}" onclick="selTipo(this,'Consigna')">🤝 Consigna</button></div>`:`<input type="hidden" id="v-tipo" value="${tipo}">`}
      <input type="hidden" id="v-id" value="${v?.id||''}">
      <div class="form-row">

function selTipo(btn,tipo){document.querySelectorAll('.tipo-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tipo-fields').forEach(f=>f.classList.remove('visible'));document.getElementById('campos-'+tipo.toLowerCase())?.classList.add('visible');}
function calcPct(){const pt=moneyVal('v-ptoma'),pl=moneyVal('v-ptabla'),el=document.getElementById('v-pct');if(el)el.value=(pt&&pl)?`${((pt/pl)*100).toFixed(1)}%`:'—';}
function vzToggleCaja(label){const cb=label.querySelector('input');const extra=document.getElementById('v-caja-extra');if(extra)extra.style.display=cb.checked?'':'none';}
function abrirAgregarMarca(){const m=prompt('Nombre de la nueva marca:');if(!m?.trim())return;google.script.run.withSuccessHandler(r=>{if(r.ok){toast(`Marca "${r.marca}" agregada`,'ok');const sel=document.getElementById('v-marca');const opt=document.createElement('option');opt.value=r.marca;opt.textContent=r.marca;opt.selected=true;sel.appendChild(opt);if(CONFIG)CONFIG.marcas=[...CONFIG.marcas,r.marca].sort();}else toast(r.error||'Error','err');}).saveMarca(m.trim());}

function guardarVehiculo(){
  const tipoActivo=document.querySelector('.tipo-btn.active');
  const tipoMap={'🚗 Usado':'Usado','✨ OKM':'OKM','🤝 Consigna':'Consigna'};
  const tipo=tipoActivo?tipoMap[tipoActivo.textContent.trim()]:(document.getElementById('v-tipo')?.value||'Usado');
  const data={id:document.getElementById('v-id').value||null,dominio:document.getElementById('v-dominio').value.toUpperCase().trim(),marca:document.getElementById('v-marca').value.trim(),modelo:document.getElementById('v-modelo').value.trim(),anio:parseInt(document.getElementById('v-anio').value)||'',tipo,fecha_ingreso:document.getElementById('v-fecha').value,observaciones:document.getElementById('v-obs').value};
  if(!data.dominio||!data.marca||!data.modelo){toast('Completá dominio, marca y modelo','err');return;}
  if(tipo==='Usado'){data.precio_toma=moneyVal('v-ptoma');data.precio_tabla=moneyVal('v-ptabla');data.ex_dueno_nombre=document.getElementById('v-exnombre').value;data.ex_dueno_apellido=document.getElementById('v-exapellido').value;data.ex_dueno_tel=document.getElementById('v-extel').value;}
  if(tipo==='OKM'){data.precio_toma=moneyVal('v-pcompra');data.ex_dueno_nombre=document.getElementById('v-proveedor').value;data.ex_dueno_tel=document.getElementById('v-provtel').value;}
  if(tipo==='Consigna'){data.markup_consigna=1+(parseFloat(document.getElementById('v-markup').value)||30)/100;data.ex_dueno_nombre=document.getElementById('v-propnombre').value;data.ex_dueno_apellido=document.getElementById('v-propapellido').value;data.ex_dueno_tel=document.getElementById('v-proptel').value;}
  // Caja egreso opcional al registrar compra (solo vehículo nuevo, no consigna)
  if(!data.id && tipo!=='Consigna'){
    data.registrar_caja=document.getElementById('v-reg-caja')?.checked??true;
    data.medio_pago_compra=document.getElementById('v-medio-compra')?.value||'Efectivo';
    const pusd=parseFloat(document.getElementById('v-usd-monto')?.value)||0;
    const ptc=parseFloat(document.getElementById('v-usd-tc')?.value)||0;
    if(pusd&&ptc){data.usd_monto=pusd;data.usd_tc=ptc;}
  }
  const btn=document.querySelector('.modal-foot .btn-primary');btn.disabled=true;btn.textContent='Guardando...';
  google.script.run.withSuccessHandler(r=>{
    cerrarModal();
    toast(r.nuevo?`Vehículo agregado${data.registrar_caja?' · Egreso en caja':''}`:' Actualizado','ok');
    loadInventario(INV_FILTRO);dashLoaded=false;
  }).withFailureHandler(()=>{toast('Error','err');btn.disabled=false;btn.textContent='Guardar';}).saveVehiculo(data);
}

function initCajaMes(){
  const sel=document.getElementById('caja-mes');
  if(sel.children.length>1) return;
  sel.innerHTML='<option value="">Todo el período</option>';
  const now=new Date();
  for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const opt=document.createElement('option');opt.value=`${d.getMonth()+1}-${d.getFullYear()}`;opt.textContent=d.toLocaleString('es-AR',{month:'long',year:'numeric'});if(i===0)opt.selected=true;sel.appendChild(opt);}
}

function switchCajaTab(btn,tab){
  CAJA_TAB=tab;
  document.querySelectorAll('.itab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.itab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('itab-'+tab)?.classList.add('active');
  loadCajaTab(tab);
}

function recargarCajaActual(){ loadCajaTab(CAJA_TAB); }

function loadCajaTab(tab){
  const sel=document.getElementById('caja-mes'),val=sel?.value||'',mes=val?val.split('-')[0]:null,anio=val?val.split('-')[1]:null;
  if(tab==='general') loadMovimientos(mes,anio,'general');
  if(tab==='ars')     loadMovimientos(mes,anio,'ARS');
  if(tab==='gastos')  loadGastosAgencia(mes,anio);
  if(tab==='cheques') loadCheques('');
  if(tab==='dolares') loadDolares(mes,anio);
  loadBalances(); // always refresh balances
}

function loadMovimientos(mes,anio,subCaja){
  const tbodyId = (subCaja==='ARS') ? 'caja-tbody-ars' : 'caja-tbody-general';
  const tbody=document.getElementById(tbodyId);
  if(!tbody) return;
  tbody.innerHTML=`<tr><td colspan="8" class="empty-row">Cargando...</td></tr>`;
  const serverFilter = (subCaja==='general') ? null : subCaja;
  google.script.run.withSuccessHandler(r=>{
    if(!r.ok){toast('Error','err');return;}
    const s=r.saldo;
    // Update main saldo display
    const saldoEl=document.getElementById('caja-saldo-txt');
    if(saldoEl){saldoEl.textContent=fmtARS(s);saldoEl.className=s>=0?'caja-saldo-pos':'caja-saldo-neg';}
    if(!r.movimientos.length){tbody.innerHTML=`<tr><td colspan="8" class="empty-row">Sin movimientos en este período</td></tr>`;return;}
    const subBadgeColor={ARS:'#dbeafe',USD:'#d1fae5',CHQ:'#ede9fe'};
    tbody.innerHTML=r.movimientos.map(m=>{
      const ref=parseRef(m.referencia);
      const subLabel=m.sub_caja||'ARS';
      return `<tr class="no-click">
        <td style="white-space:nowrap;font-size:12px">${m.fecha}</td>
        <td><strong style="font-size:13px">${m.detalle||'—'}</strong>${m.observacion?`<br><small style="color:var(--t3)">${m.observacion}</small>`:''}</td>
        <td style="font-size:12px;color:var(--t2)">${m.concepto||'—'}</td>
        <td><span class="badge" style="background:${subBadgeColor[subLabel]||'#f3f4f6'};color:var(--t2)">${subLabel}</span></td>
        <td class="num">${m.debe?`<span class="income-val">+${fmtARS(m.debe)}</span>`:'—'}</td>
        <td class="num">${m.haber?`<span class="expense-val">-${fmtARS(m.haber)}</span>`:'—'}</td>
        <td class="num"><span class="${m.saldo>=0?'caja-saldo-pos':'caja-saldo-neg'}">${fmtARS(m.saldo)}</span></td>
        <td><div style="display:flex;align-items:center;gap:4px">
          ${ref?`<span class="ref-badge" onclick="abrirRef('${m.referencia}')">${ref.icon} ${ref.label}</span>`:''}
          ${USER.role==='admin'?`<div class="row-actions"><button class="btn-ico danger" onclick="eliminarMovimientoCaja('${m.id}')" title="Eliminar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button></div>`:''}
        </div></td>
      </tr>`;
    }).join('');
  }).getMovimientosCaja(mes,anio,serverFilter,ENTIDAD_ACTUAL);
}

function parseRef(ref){
  if(!ref) return null;
  const [tipo]=ref.split(':');
  const map={VTA:{icon:'🚗',label:'Venta'},GV:{icon:'🔧',label:'Gasto auto'},GA:{icon:'📑',label:'Gasto agencia'},CHQ:{icon:'📋',label:'Cheque'},USD:{icon:'💵',label:'Dólar'},VEH:{icon:'🚗',label:'Auto'}};
  return map[tipo]||null;
}

function abrirRef(ref){
  if(!ref) return;
  const [tipo,id]=ref.split(':');
  if(!id){return;}
  // Show a summary modal
  document.getElementById('ref-inner').innerHTML=`<div class="ref-modal-head"><strong>${tipo} — ${id}</strong><button class="btn-close" onclick="cerrarRef()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="ref-modal-body" style="text-align:center;padding:30px;color:var(--t3)">Cargando detalle...</div><div class="ref-modal-foot"><button class="btn-secondary" onclick="cerrarRef()">Cerrar</button>${tipo==='VEH'||tipo==='VTA'||tipo==='GV'?`<button class="btn-primary" onclick="irARef('${ref}')">Ver en inventario →</button>`:''}${tipo==='CHQ'?`<button class="btn-primary" onclick="irATab('cheques')">Ver cheques →</button>`:''}${tipo==='USD'?`<button class="btn-primary" onclick="irATab('dolares')">Ver dólares →</button>`:''}${tipo==='GA'?`<button class="btn-primary" onclick="irATab('gastos')">Ver gastos →</button>`:''}
  </div>`;
  document.getElementById('ref-overlay').classList.add('open');
  // Load detail based on type
  if(tipo==='VTA'||tipo==='GV'||tipo==='VEH'){
    const idVeh=tipo==='VEH'?id:null;
    // For now show the id and info
    document.getElementById('ref-inner').querySelector('.ref-modal-body').innerHTML=`
      <div class="ref-detail-row"><span class="ref-detail-lbl">Referencia</span><span class="ref-detail-val">${ref}</span></div>
      <p style="color:var(--t3);font-size:12px;text-align:center;margin-top:12px">Usá el botón para ver el detalle completo</p>`;
  }
}
function cerrarRef(e){if(e&&e.target!==document.getElementById('ref-overlay'))return;document.getElementById('ref-overlay').classList.remove('open');}
function irARef(ref){cerrarRef();const[tipo,id]=ref.split(':');navigate('inventario');if(id&&id.startsWith('VEH'))setTimeout(()=>abrirFicha(id),300);}
function irATab(tab){cerrarRef();navigate('caja');setTimeout(()=>{document.querySelector(`.itab[onclick*="${tab}"]`)?.click();},100);}
function eliminarMovimientoCaja(id){showConfirm('Eliminar movimiento','¿Eliminar este movimiento? Se recalcularán los saldos.','Eliminar',()=>{google.script.run.withSuccessHandler(r=>{if(r.ok){toast('Movimiento eliminado','ok');loadCajaTab(CAJA_TAB);loadBalances();}}).deleteMovimientoCaja(id);},'err');}
function eliminarMovimiento(id){eliminarMovimientoCaja(id);}// alias

function eliminarGastoAg(id){showConfirm('Eliminar gasto','¿Eliminar este gasto de agencia?','Eliminar',()=>google.script.run.withSuccessHandler(r=>{if(r.ok){toast('Gasto eliminado','ok');loadGastosAgencia();}}).deleteGastoAgencia(id),'err');}

function filtrarCheques(btn,f){document.querySelectorAll('#itab-cheques .ftab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');loadCheques(f);}
function loadCheques(f){
  document.getElementById('cheques-tbody').innerHTML=`<tr><td colspan="9" class="empty-row">Cargando...</td></tr>`;
  google.script.run.withSuccessHandler(rows=>{
    const tbody=document.getElementById('cheques-tbody');
    if(!rows.length){tbody.innerHTML=`<tr><td colspan="9" class="empty-row">Sin cheques</td></tr>`;return;}
    const isAdmin=USER.role==='admin';
    const estBadge={'En cartera':'badge-stock','Depositado':'badge-usado','Acreditado':'badge-vendido','Rechazado':'badge-vencido','Anulado':'badge-reservado','Emitido':'badge-reservado','Cobrado':'badge-vendido'};
    tbody.innerHTML=rows.map(c=>{
      let btns='';
      if(isAdmin){
        if(c.estado==='En cartera'&&c.tipo==='De tercero'){
          btns+=`<button class="btn-ico ok" onclick="cambiarEstadoCheque('${c.id}','Depositado')" title="Depositar">🏦</button>`;
          btns+=`<button class="btn-ico ok" onclick="cambiarEstadoCheque('${c.id}','Acreditado')" title="Acreditar">✅</button>`;
          btns+=`<button class="btn-ico danger" onclick="cambiarEstadoCheque('${c.id}','Rechazado')" title="Rechazar">❌</button>`;
        }
        if(c.estado==='Depositado') btns+=`<button class="btn-ico ok" onclick="cambiarEstadoCheque('${c.id}','Acreditado')" title="Acreditar">✅</button>`;
        if(c.estado==='Emitido'&&c.tipo==='Propio') btns+=`<button class="btn-ico ok" onclick="cambiarEstadoCheque('${c.id}','Cobrado')" title="Cobrado">✅</button>`;
        btns+=`<button class="btn-ico" onclick="abrirEditarCheque('${c.id}')" title="Editar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>`;
        btns+=`<button class="btn-ico danger" onclick="eliminarCheque('${c.id}')" title="Eliminar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>`;
      }
      return `<tr class="no-click">
        <td><strong>${c.numero||'—'}</strong></td>
        <td><span class="badge" style="background:#f3f4f6;color:var(--t2)">${c.tipo}</span></td>
        <td>${c.banco||'—'}</td><td>${c.librador||'—'}</td>
        <td class="num"><strong>${fmtARS(c.importe)}</strong></td>
        <td style="font-size:12px"><span class="${c.dias_vto!==null?(c.dias_vto<0?'dias-err':c.dias_vto<7?'dias-warn':'dias-ok'):''}">${c.fecha_vto||'—'}</span></td>
        <td style="font-size:12px;color:var(--t3)">${c.fecha_cobro||'—'}</td>
        <td><span class="badge ${estBadge[c.estado]||'badge-usado'}">${c.estado}</span></td>
        <td><div class="row-actions" style="opacity:1">${btns}</div></td>
      </tr>`;
    }).join('');
  }).getCheques(f, ENTIDAD_ACTUAL);
}

function cambiarEstadoCheque(id,estado){
  if(['Acreditado','Cobrado','Depositado'].includes(estado)){
    const hoy=new Date().toISOString().slice(0,10);
    document.getElementById('modal-inner').innerHTML=`
      <div class="modal-head"><div class="modal-title">Marcar como ${estado}</div>
        <button class="btn-close" onclick="cerrarModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div class="modal-body"><div class="form-group"><label class="lbl">Fecha de ${estado.toLowerCase()}</label>

function loadDolares(mes,anio){
  document.getElementById('dolares-tbody').innerHTML=`<tr><td colspan="7" class="empty-row">Cargando...</td></tr>`;
  google.script.run.withSuccessHandler(rows=>{
    const tbody=document.getElementById('dolares-tbody');
    if(!rows.length){tbody.innerHTML=`<tr><td colspan="7" class="empty-row">Sin movimientos en USD</td></tr>`;return;}
    const ingTipos=['Compra','Ingreso','Cobro'];
    const total_usd=rows.reduce((s,r)=>s+(ingTipos.includes(r.tipo)?r.monto_usd:-r.monto_usd),0);
    const isAdmin=USER.role==='admin';
    tbody.innerHTML=rows.map(r=>`<tr class="no-click">
      <td style="font-size:12px">${r.fecha}</td>
      <td><span class="badge ${ingTipos.includes(r.tipo)?'badge-stock':'badge-vendido'}">${r.tipo}</span></td>
      <td class="num"><strong>${r.monto_usd.toFixed(2)}</strong></td>
      <td class="num" style="color:var(--t3)">$ ${fmt(r.tc)}</td>
      <td class="num">${fmtARS(r.monto_ars)}</td>
      <td>${r.contraparte||'—'}</td>
      <td>${isAdmin?`<div class="row-actions"><button class="btn-ico danger" onclick="eliminarDolar('${r.id}')" title="Eliminar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button></div>`:''}</td>
    </tr>`).join('')+`<tr class="no-click" style="background:#f9fafb;font-weight:700">
      <td colspan="2" style="font-size:12px;color:var(--t3)">POSICIÓN NETA</td>
      <td class="num" style="color:${total_usd>=0?'var(--ok)':'var(--err)'}">${total_usd>=0?'+':''}${total_usd.toFixed(2)} USD</td>
      <td colspan="4"></td></tr>`;
  }).getDolares(mes,anio,ENTIDAD_ACTUAL);
}
function eliminarDolar(id){showConfirm('Eliminar registro USD','¿Eliminar este movimiento en dólares?','Eliminar',()=>google.script.run.withSuccessHandler(r=>{if(r.ok){toast('Eliminado','ok');loadDolares();loadBalances();}}).deleteDolar(id),'err');}

let WZ = { tipo:null, concepto:null, preVehiculo:null }; // wizard state

function wzSetTipo(tipo){
  WZ.tipo=tipo; WZ.concepto=null;

function wzSelConcepto(key){
  WZ.concepto=key;
  document.querySelectorAll('.concept-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.concept-btn').forEach(b=>{if(b.querySelector('span:last-child').textContent===CONCEPTOS[WZ.tipo]?.find(c=>c.key===key)?.label)b.classList.add('active');});

let VEH_MAP = {}; // cache de datos de vehículos para el wizard

// Toggle para "parte de pago con auto"
function wzToggleVehPago(label){
  const cb=label.querySelector('input');
  const fields=document.getElementById('wf-veh-pago-fields');
  if(fields) fields.style.display=cb.checked?'':'none';
  if(!cb.checked) setMoney('wf-veh',0);
  wzCalcDif();
}

// Pre-cargar el costo estimado cuando se selecciona el auto de parte de pago
function wzSetVehParteCosto(){
  const sel=document.getElementById('wf-auto-parte'); if(!sel||!sel.value) return;
  const opt=sel.options[sel.selectedIndex];
  const costo=parseFloat(opt?.getAttribute('data-costo'))||0;
  const hint=document.getElementById('wf-veh-costo-hint');
  if(hint&&costo>0){hint.textContent=`Costo registrado: ${fmtARS(costo)}`;hint.style.color='var(--t2)';}
  // No pre-llenamos el valor — el vendedor negocia libremente
  wzCalcDif();
}

function wzPreloadVehiculo(){
  const sel=document.getElementById('wf-vehiculo'); if(!sel||!sel.value) return;
  const veh=VEH_MAP[sel.value]||{};
  sel.dataset.costo=veh.costo_total||0;
  
  // Precio sugerido de venta (punto 2): explica de dónde viene
  let sugerido=0, hintTxt='';
  if(veh.tipo==='Consigna'&&veh.markup_consigna>0){
    sugerido=Math.round((veh.precio_toma||0)*veh.markup_consigna);
    hintTxt=`Tabla consigna = toma × ${((veh.markup_consigna-1)*100).toFixed(0)}%`;
  } else if(veh.precio_tabla>0){
    sugerido=veh.precio_tabla;
    hintTxt=`Precio tabla del vehículo`;
  } else if(veh.costo_total>0){
    sugerido=Math.round(veh.costo_total*1.20);
    hintTxt=`Costo ${fmtARS(veh.costo_total)} + 20% margen`;
  }
  if(sugerido>0){
    setMoney('wf-precio',sugerido);
    const hint=document.getElementById('wf-precio-hint');
    if(hint){hint.textContent=`💡 ${hintTxt} — podés cambiarlo`;hint.style.color='var(--ok)';}
  }
  wzCalcGanancia();
}
function wzCalcGanancia(){
  const precio=moneyVal('wf-precio');
  const costo=parseFloat(document.getElementById('wf-vehiculo')?.dataset.costo)||0;
  const g=precio-costo, prev=document.getElementById('wf-ganancia-prev');
  if(prev&&precio>0){prev.style.display='';prev.className=`ganancia-preview ${g>=0?'pos':'neg'}`;document.getElementById('wf-gp-val').textContent=fmtARS(g);document.getElementById('wf-gp-sub').textContent=`${((g/(costo||1))*100).toFixed(1)}% sobre costo · Costo: ${fmtARS(costo)}`;}
  wzCalcDif();
}
function wzCalcDif(){
  const precio=moneyVal('wf-precio'),ef=moneyVal('wf-ef'),veh=moneyVal('wf-veh'),fin=moneyVal('wf-fin');
  const dif=precio-(ef+veh+fin),difRow=document.getElementById('wf-dif');
  if(difRow&&precio>0&&Math.abs(dif)>1){difRow.classList.add('show');document.getElementById('wf-dif-val').textContent=fmtARS(Math.abs(dif));}
  else if(difRow)difRow.classList.remove('show');
}
function wzCalcTotal(){
  const n=moneyVal('wf-neto'),i=moneyVal('wf-iva');
  setMoney('wf-total',n+i);
  payAutoFillFromImporte(); // actualizar campo de pago cuando cambia el total
}

// ── Medio de pago ────────────────────────────────────────────
function payMedioChanged(){
  const medio=document.getElementById('ps-medio')?.value||'ARS';
  const isMix=medio==='MIX';
  ['ars','usd','chq'].forEach(k=>{
    const el=document.getElementById('pbs-'+k);
    if(el) el.style.display=(!isMix&&medio===k.toUpperCase())?'':'none';
  });
  document.getElementById('pbs-mix').style.display=isMix?'':'none';
  if(isMix){
    if(!MIX_ROWS.length){MIX_ROWS=[{medio:'ARS'}];mixRenderAll();}
    const total=mixGetMainTotal();
    if(total>0)mixSetRowAmount(0,total);
    calcMixTotal();
  } else {
    payAutoFillFromImporte();
  }
}

// Auto-llena según importe y medio seleccionado
function payAutoFillFromImporte(){
  const medio=document.getElementById('ps-medio')?.value||'ARS';
  if(medio==='MIX'){const t=mixGetMainTotal();if(t>0&&MIX_ROWS.length>0)mixSetRowAmount(0,t);calcMixTotal();return;}
  if(medio==='CHQ'){calcPayTotal();return;}
  const imp=moneyVal('wf-importe')||moneyVal('wf-total')||moneyVal('wf-neto')||0;
  if(!imp){calcPayTotal();return;}
  if(medio==='ARS'){setMoney('ps-ars',imp);payValidateARS();}
  else if(medio==='USD'){
    const tc=parseFloat(document.getElementById('ps-usd-tc')?.value)||SALDOS.tcBlue||CONFIG?.tc_blue||1450;
    if(tc>0){const usdEl=document.getElementById('ps-usd-monto');if(usdEl)usdEl.value=(imp/tc).toFixed(2);setMoney('ps-usd-ars',imp);}
    payValidateUSD();
  }
  calcPayTotal();
}

// ── MIXTO — estado y renderizado ─────────────────────────────
let MIX_ROWS=[]; // [{medio:'ARS'|'USD'|'CHQ'}]

function mixGetMainTotal(){return moneyVal('wf-importe')||moneyVal('wf-total')||moneyVal('wf-neto')||0;}

function mixRenderAll(){
  const c=document.getElementById('mix-rows-container');if(!c)return;
  const tc=SALDOS.tcBlue||CONFIG?.tc_blue||1450;
  const sARS=SALDOS.saldoARS||0,sUSD=SALDOS.posUSD||0,sChq=SALDOS.chequesEnCartera||0;
  c.innerHTML=MIX_ROWS.map((row,i)=>{
    let amtHtml='';
    if(row.medio==='ARS')amtHtml=`<input class="field money" id="mix-ars-${i}" placeholder="$ 0" style="flex:1" oninput="mixAmountChanged(${i})">`;
    else if(row.medio==='USD')amtHtml=`<div class="pay-usd-row" style="flex:1">
      <input type="number" id="mix-usd-monto-${i}" placeholder="0.00" step="0.01" class="field" style="flex:1" oninput="mixCalcUSD(${i});mixAmountChanged(${i})">
      <span class="pay-usd-sep">×</span>
      <input type="number" id="mix-usd-tc-${i}" value="${tc}" class="field" style="width:72px" oninput="mixCalcUSD(${i})">
      <span class="pay-usd-sep">=</span>
      <input class="field money" id="mix-usd-ars-${i}" readonly placeholder="$ 0" style="flex:1;background:#f0fdf4;font-weight:700"></div>`;
    else if(row.medio==='CHQ')amtHtml=`<div id="mix-chq-list-${i}" class="pay-chq-list" style="flex:1;min-width:140px"><div class="pay-chq-loading">Cargando...</div></div>`;
    const avail=row.medio==='ARS'?`${fmtARS(sARS)} disp.`:row.medio==='USD'?`${sUSD.toFixed(2)} USD disp.`:`${fmtARS(sChq)} disp.`;
    return `<div class="mix-row" id="mix-row-${i}">
      <select class="field mix-medio-sel" id="mix-medio-${i}" onchange="mixMedioChanged(${i})" style="flex:0 0 140px;font-size:13px">
        <option value="ARS" ${row.medio==='ARS'?'selected':''}>💵 Pesos ARS</option>
        <option value="USD" ${row.medio==='USD'?'selected':''}>💰 Dólares</option>
        <option value="CHQ" ${row.medio==='CHQ'?'selected':''}>📋 Cheque</option>
      </select>
      ${amtHtml}
      <span class="mix-avail">${avail}</span>
      ${i>0?`<button class="btn-ico danger mix-del" onclick="mixRemoveRow(${i})" title="Quitar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`:''}
    </div>`;
  }).join('');
  // Cargar cheques para filas de tipo CHQ
  MIX_ROWS.forEach((row,i)=>{if(row.medio==='CHQ')mixLoadCheques(i);});
  const addBtn=document.getElementById('mix-add-btn');
  if(addBtn)addBtn.style.display=MIX_ROWS.length>=4?'none':'';
}

function mixAddRow(){
  if(MIX_ROWS.length>=4)return;
  MIX_ROWS.push({medio:'ARS'});
  mixRenderAll();
  // Poner el resto en la nueva fila
  const total=mixGetMainTotal();
  let sum=0;for(let i=0;i<MIX_ROWS.length-1;i++)sum+=mixGetRowARS(i);
  mixSetRowAmount(MIX_ROWS.length-1,Math.max(0,total-sum));
  calcMixTotal();
}

function mixRemoveRow(idx){
  MIX_ROWS.splice(idx,1);
  mixRenderAll();
  // Si queda 1 sola fila, poner el total completo
  if(MIX_ROWS.length===1)mixSetRowAmount(0,mixGetMainTotal());
  calcMixTotal();
}

function mixMedioChanged(idx){
  MIX_ROWS[idx].medio=document.getElementById('mix-medio-'+idx)?.value||'ARS';
  const prevAmt=mixGetRowARS(idx); // guardar monto antes de re-render
  mixRenderAll();
  // Restaurar monto si era ARS o USD
  if(MIX_ROWS[idx].medio!=='CHQ')mixSetRowAmount(idx,prevAmt);
  calcMixTotal();
}

// Cascade: cuando cambia el monto en fila idx, la siguiente recibe el resto
function mixAmountChanged(idx){
  const total=mixGetMainTotal();if(!total){calcMixTotal();return;}
  let sum=0;for(let i=0;i<=idx;i++)sum+=mixGetRowARS(i);
  const resto=Math.max(0,total-sum);
  if(idx+1<MIX_ROWS.length)mixSetRowAmount(idx+1,resto);
  calcMixTotal();
}

function mixCalcUSD(idx){
  const monto=parseFloat(document.getElementById('mix-usd-monto-'+idx)?.value)||0;
  const tc=parseFloat(document.getElementById('mix-usd-tc-'+idx)?.value)||0;
  if(tc>0)setMoney('mix-usd-ars-'+idx,Math.round(monto*tc));
}

function mixGetRowARS(idx){
  const m=MIX_ROWS[idx]?.medio||'ARS';
  if(m==='ARS')return moneyVal('mix-ars-'+idx);
  if(m==='USD')return moneyVal('mix-usd-ars-'+idx);
  if(m==='CHQ'){let t=0;document.querySelectorAll('#mix-chq-list-'+idx+' input[type=checkbox]:checked').forEach(cb=>{t+=parseFloat(cb.dataset.importe)||0;});return t;}
  return 0;
}

function mixSetRowAmount(idx,amount){
  const m=MIX_ROWS[idx]?.medio||'ARS';
  if(m==='ARS'){setMoney('mix-ars-'+idx,amount);}
  else if(m==='USD'){
    const tc=parseFloat(document.getElementById('mix-usd-tc-'+idx)?.value)||SALDOS.tcBlue||1450;
    const usdEl=document.getElementById('mix-usd-monto-'+idx);
    if(usdEl&&tc>0)usdEl.value=(amount/tc).toFixed(2);
    setMoney('mix-usd-ars-'+idx,amount);
  }
  // CHQ: no se puede auto-setear, el usuario elige cheques
}

function mixLoadCheques(idx){
  const list=document.getElementById('mix-chq-list-'+idx);if(!list)return;
  google.script.run.withSuccessHandler(cheques=>{
    if(!cheques.length){list.innerHTML='<div class="pay-chq-loading" style="color:var(--t3)">No hay cheques disponibles</div>';return;}
    list.innerHTML=cheques.map(c=>`<label class="pay-chq-item">
      <input type="checkbox" data-id="${c.id}" data-importe="${c.importe}" onchange="calcMixTotal()">
      <div class="pay-chq-info"><strong>#${c.numero}</strong> · ${c.banco}
        <span style="color:var(--t3)">${c.librador}${c.fecha_vto?' · '+c.fecha_vto:''}</span></div>
      <strong class="pay-chq-amt">${fmtARS(c.importe)}</strong></label>`).join('');
  }).getChequesDisponibles(ENTIDAD_ACTUAL);

function _getPaymentSources(){
  const medio=document.getElementById('ps-medio')?.value||'ARS';

  if(medio==='MIX'){
    const mix=[];
    MIX_ROWS.forEach((row,i)=>{
      if(row.medio==='ARS'){const ars=moneyVal('mix-ars-'+i);if(ars>0)mix.push({medio:'ARS',ars});}
      else if(row.medio==='USD'){
        const usd=parseFloat(document.getElementById('mix-usd-monto-'+i)?.value)||0;
        const tc=parseFloat(document.getElementById('mix-usd-tc-'+i)?.value)||0;
        if(usd>0&&tc>0)mix.push({medio:'USD',usd,tc,ars:Math.round(usd*tc)});
      }
      else if(row.medio==='CHQ'){
        const chqs=[];document.querySelectorAll('#mix-chq-list-'+i+' input[type=checkbox]:checked').forEach(cb=>{chqs.push({id:cb.dataset.id,importe:parseFloat(cb.dataset.importe)||0});});
        if(chqs.length)mix.push({medio:'CHQ',cheques:chqs});
      }
    });
    return mix.length?{mix}:null;
  }

  // Método único
  const ps={};
  if(medio==='ARS'){const ars=moneyVal('ps-ars');if(ars>0)ps.ars=ars;}
  else if(medio==='USD'){const usd=parseFloat(document.getElementById('ps-usd-monto')?.value)||0;const tc=parseFloat(document.getElementById('ps-usd-tc')?.value)||0;if(usd>0&&tc>0)ps.usd={monto_usd:usd,tc};}
  // CHQ: los cheques se guardan a través del concepto cobro_cheque
  return Object.keys(ps).length?ps:null;
}

        'Confirmar venta',()=>{

            vendedor:document.getElementById('wf-vendedor').value,

            if(r.ok){cerrarModal();toast(`Venta registrada · Ganancia: ${fmtARS(r.ganancia||0)}`,'ok');loadMovimientos();loadBalances();dashLoaded=false;}
            else{toast(r.error||'Error','err');btn.disabled=false;btn.textContent='Guardar movimiento';}

          .saveMovimientoCajaCompleto(d2);
        },'warn')) return;
      return; // showConfirm es async, el guardado se hace en el callback

    else if(WZ.concepto==='gasto_auto'){

  document.getElementById('rep-body').innerHTML = `<div style="text-align:center;padding:60px;color:var(--t3)">Calculando...</div>`;
  google.script.run.withSuccessHandler(renderReporte).withFailureHandler(()=>toast('Error al cargar','err')).getReporteMensual(mes,anio);
}

function renderReporte(d) {
  if (!d?.ok) { document.getElementById('rep-body').innerHTML=`<p style="color:var(--err);padding:20px">Error: ${d?.error||'Desconocido'}</p>`; return; }
  const delta = d.resultado-d.prev_neto, deltaSign = delta>=0?'+':'';
  const pctDelta = d.prev_neto?Math.abs(((delta/d.prev_neto)*100)).toFixed(0):'—';
  const tiposHtml = Object.entries(d.ventas.porTipo||{}).map(([t,v])=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f3f4f6">
      <span class="badge badge-${t.toLowerCase()}">${t}</span>
      <span style="font-size:12px;color:var(--t2)">${v.count} auto${v.count!==1?'s':''}</span>
      <span style="font-size:13px;font-weight:600">${fmtARS(v.ganancia)}</span>
    </div>`).join('');
  const gastoCats = Object.entries(d.gastosAgencia.porCategoria||{})
    .sort(([,a],[,b])=>b-a);
  const gastoRows = gastoCats.map(([cat,total])=>{
    const pctG = d.gastosAgencia.total?((total/d.gastosAgencia.total)*100).toFixed(0):0;
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f3f4f6">
      <span style="flex:1;font-size:13px">${cat}</span>
      <div style="width:80px;background:#f3f4f6;border-radius:4px;height:6px;overflow:hidden"><div style="width:${pctG}%;background:var(--err);height:100%;border-radius:4px"></div></div>
      <span style="font-size:11px;color:var(--t3);width:30px;text-align:right">${pctG}%</span>
      <span style="font-size:13px;font-weight:600;width:90px;text-align:right">${fmtARS(total)}</span>
    </div>`;}).join('');

  document.getElementById('rep-body').innerHTML = `
    <!-- KPIs Row 1 -->
    <div class="rep-kpis">
      <div class="rep-kpi"><div class="rep-kpi-lbl">Ventas</div><div class="rep-kpi-val">${d.ventas.count}</div><div class="rep-kpi-sub">autos vendidos</div></div>
      <div class="rep-kpi"><div class="rep-kpi-lbl">Ingresos brutos</div><div class="rep-kpi-val" style="color:var(--ok)">${fmtARS(d.ventas.total)}</div><div class="rep-kpi-sub">precio total de ventas</div></div>
      <div class="rep-kpi"><div class="rep-kpi-lbl">Ganancia bruta</div><div class="rep-kpi-val" style="color:var(--accent)">${fmtARS(d.ventas.ganancia)}</div><div class="rep-kpi-sub">margen ${d.ventas.margen}% sobre costo</div></div>
      <div class="rep-kpi"><div class="rep-kpi-lbl">Gastos agencia</div><div class="rep-kpi-val" style="color:var(--err)">${fmtARS(d.gastosAgencia.total)}</div><div class="rep-kpi-sub">${d.gastosAgencia.count} comprobantes</div></div>
      <div class="rep-kpi rep-kpi-resultado ${d.resultado>=0?'pos':'neg'}">
        <div class="rep-kpi-lbl">Resultado neto</div>
        <div class="rep-kpi-val">${fmtARS(d.resultado)}</div>
        <div class="rep-kpi-sub">${delta!==0?`${deltaSign}${fmtARS(delta)} vs mes ant. (${deltaSign}${pctDelta}%)`:'Sin comparación'}</div>
      </div>
    </div>

    <!-- KPIs Row 2 — Indicadores operativos -->
    <div class="rep-kpis" style="margin-top:10px">
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">🏷️ Costo de comercialización</div>
        <div class="rep-kpi-val" style="color:var(--warn)">${d.costoComercializacion!==null?fmtARS(d.costoComercializacion):'—'}</div>
        <div class="rep-kpi-sub">por auto vendido · gastos agencia ÷ ventas</div>
      </div>
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">🔄 Rotación de stock</div>
        <div class="rep-kpi-val" style="color:var(--accent)">${d.rotacionDias!==null?d.rotacionDias+'d':'—'}</div>
        <div class="rep-kpi-sub">promedio días en stock antes de venderse</div>
      </div>
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">📦 Stock actual</div>
        <div class="rep-kpi-val">${d.stockCount}</div>
        <div class="rep-kpi-sub">autos en inventario · ${fmtARS(d.stockValue)} en costo</div>
      </div>
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">💵 Precio prom. venta</div>
        <div class="rep-kpi-val">${d.ventas.count?fmtARS(d.ventas.promPrecio):'—'}</div>
        <div class="rep-kpi-sub">precio promedio del período</div>
      </div>
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">💰 Posición USD</div>
        <div class="rep-kpi-val" style="color:${d.posUSD>=0?'var(--ok)':'var(--err)'}">${d.posUSD>=0?'+':''}${d.posUSD.toFixed(2)} USD</div>
        <div class="rep-kpi-sub">posición neta acumulada en dólares</div>
      </div>
    </div>

    <div class="rep-grid">
      <!-- Ventas por tipo -->
      <div class="rep-card">
        <h3 class="rep-card-title">Ventas por tipo de vehículo</h3>
        ${tiposHtml||`<p style="color:var(--t3);font-size:13px;text-align:center;padding:20px 0">Sin ventas en el período</p>`}
        ${d.ventas.count?`<div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:4px;font-weight:600;font-size:13px"><span>Total</span><span>${fmtARS(d.ventas.ganancia)}</span></div>`:''}
      </div>

      <!-- Gastos por categoría -->
      <div class="rep-card">
        <h3 class="rep-card-title">Gastos de agencia por categoría</h3>
        ${gastoRows||`<p style="color:var(--t3);font-size:13px;text-align:center;padding:20px 0">Sin gastos en el período</p>`}
        ${d.gastosAgencia.total?`<div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:4px;font-weight:600;font-size:13px"><span>Total</span><span style="color:var(--err)">${fmtARS(d.gastosAgencia.total)}</span></div>`:''}
      </div>

      <!-- Ventas del mes -->
      <div class="rep-card" style="grid-column:1/-1">
        <h3 class="rep-card-title">Detalle de ventas</h3>
        ${!d.ventas.lista?.length?`<p style="color:var(--t3);font-size:13px;text-align:center;padding:20px 0">Sin ventas en el período</p>`:
        `<table class="data-table"><thead><tr><th>Fecha</th><th>Vehículo</th><th>Comprador</th><th class="num">Precio</th><th class="num">Costo</th><th class="num" style="color:var(--ok)">Ganancia</th><th class="num">Margen</th></tr></thead><tbody>
        ${d.ventas.lista.map(v=>`<tr class="no-click"><td style="font-size:12px">${v.fecha}</td><td><strong>${v.vehiculo}</strong></td><td style="font-size:12px">${v.comprador||'—'}</td>
        <td class="num">${fmtARS(v.precio)}</td><td class="num" style="color:var(--t3)">${fmtARS(v.costo)}</td>
        <td class="num" style="color:var(--ok);font-weight:600">+${fmtARS(v.ganancia)}</td>
        <td class="num" style="color:var(--t3)">${v.margen}%</td></tr>`).join('')}
        </tbody></table>`}
      </div>

      <!-- Balance de caja -->
      <div class="rep-card">
        <h3 class="rep-card-title">Flujo de caja del mes</h3>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--t2)">Total ingresos</span><span style="color:var(--ok);font-weight:600">+${fmtARS(d.cajaDebe)}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:var(--t2)">Total egresos</span><span style="color:var(--err);font-weight:600">-${fmtARS(d.cajaHaber)}</span></div>
          <div style="border-top:2px solid var(--bord);padding-top:8px;display:flex;justify-content:space-between;font-size:15px;font-weight:700"><span>Flujo neto</span><span style="color:${d.cajaDebe-d.cajaHaber>=0?'var(--ok)':'var(--err)'}">${fmtARS(d.cajaDebe-d.cajaHaber)}</span></div>
        </div>
      </div>

      <!-- Posición USD -->
      <div class="rep-card">
        <h3 class="rep-card-title">Posición en dólares</h3>
        <div style="text-align:center;padding:16px 0">
          <div style="font-size:32px;font-weight:700;color:${d.posUSD>=0?'var(--ok)':'var(--err)'}">${d.posUSD>=0?'+':''}${d.posUSD.toFixed(2)} USD</div>
          <div style="font-size:12px;color:var(--t3);margin-top:4px">posición neta acumulada</div>
        </div>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════
//  MODAL HELPERS
// ══════════════════════════════════════════════════
//  MODAL HELPERS
// ══════════════════════════════════════════════════
function abrirModal(){document.getElementById('modal-overlay').classList.add('open');document.body.style.overflow='hidden';}
function cerrarModal(){document.getElementById('modal-overlay').classList.remove('open');document.body.style.overflow='';}

// ══════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════
function fmtARS(n){if(n===null||n===undefined)return'—';const v=Number(n);if(v>=1e6)return'$ '+(v/1e6).toFixed(1)+'M';if(v>=1e3)return'$ '+Math.round(v/1e3)+'K';return'$ '+fmt(v);}
function fmt(n){return new Intl.NumberFormat('es-AR').format(Math.round(n));}
function pct(a,b){return b?((a/b)*100).toFixed(1):'—';}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function isoDate(d){if(!d)return'';const p=d.split('/');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:d;}
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='show '+(type||'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',3500);}
</script>
