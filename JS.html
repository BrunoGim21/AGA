function _getPaymentSources(){
  const medio=document.getElementById('ps-medio')?.value||'ARS';

  if(medio==='MIX'){
    const mix=[];
    MIX_ROWS.forEach((row,i)=>{
      if(row.medio==='ARS'){const ars=moneyVal('mix-ars-'+i);if(ars>0)mix.push({medio:'ARS',ars});}
      else if(row.medio==='USD'){
        const usd=parseFloat(document.getElementById('mix-usd-monto-'+i)?.value)||0;
        const tc=parseFloat(document.getElementById('mix-usd-tc-'+i)?.value)||0;
        if(usd>0&&tc>0)mix.push({medio:'USD',usd,tc,ars:Math.round(usd*tc)});
      }
      else if(row.medio==='AUTO'){
        const data=mixAutoGetData(i);
        if(data.valor>0)mix.push({medio:'AUTO',valor:data.valor,id:data.id,nombre:data.nombre,ars:data.valor});
      }
      else if(row.medio==='CHQ'){
        if(PAY_MODE==='ingreso'){
          // Ingreso: cheque nuevo recibido del comprador
          const imp=moneyVal('mix-chq-imp-'+i);
          if(imp>0)mix.push({medio:'CHQ',ars:imp,cheque_data:{
            banco:document.getElementById('mix-chq-banco-'+i)?.value||'',
            numero:document.getElementById('mix-chq-num-'+i)?.value||'',
            librador:document.getElementById('mix-chq-lib-'+i)?.value||'',
            vto:document.getElementById('mix-chq-vto-'+i)?.value||''
          }});
        } else {
          // Egreso: cheques existentes de cartera
          const chqs=[];document.querySelectorAll('#mix-chq-list-'+i+' input[type=checkbox]:checked').forEach(cb=>{chqs.push({id:cb.dataset.id,importe:parseFloat(cb.dataset.importe)||0});});
          if(chqs.length)mix.push({medio:'CHQ',cheques:chqs});
        }
      }
    });
    return mix.length?{mix}:null;
  }

  // Método único
  const ps={};
  if(medio==='ARS'){const ars=moneyVal('ps-ars');if(ars>0)ps.ars=ars;}
  else if(medio==='USD'){const usd=parseFloat(document.getElementById('ps-usd-monto')?.value)||0;const tc=parseFloat(document.getElementById('ps-usd-tc')?.value)||0;if(usd>0&&tc>0)ps.usd={monto_usd:usd,tc};}
  else if(medio==='AUTO'){
    const autoId=document.getElementById('ps-auto-sel')?.value||null;
    const autoVal=moneyVal('ps-auto-val');
    const autoNombre=document.getElementById('ps-auto-sel')?.options[document.getElementById('ps-auto-sel')?.selectedIndex]?.text||'';
    if(autoVal>0)ps.auto={id:autoId,valor:autoVal,nombre:autoNombre};
  }
  else if(medio==='CHQ'){
    if(PAY_MODE==='ingreso'){
      const imp=moneyVal('ps-chq-importe');
      if(imp>0)ps.chq_nuevo={banco:document.getElementById('ps-chq-banco')?.value||'',numero:document.getElementById('ps-chq-num')?.value||'',vto:document.getElementById('ps-chq-vto')?.value||'',importe:imp};
    }
  }
  return Object.keys(ps).length?ps:null;
}

function wzGuardar(){
  const hoy=document.getElementById('wf-fecha')?.value;
  const entidad=document.getElementById('wf-entidad')?.value||'AGA';
  const obs=document.getElementById('wf-obs')?.value||'';
  const mdp=document.getElementById('wf-medio')?.value||'';
  let data={tipo:WZ.concepto, fecha:hoy, entidad, observacion:obs, medio_pago:mdp, debe:0, haber:0};

  try{
    if(WZ.concepto==='venta_auto'){
      const idVeh=document.getElementById('wf-vehiculo').value;
      if(!idVeh){toast('Seleccioná un vehículo','err');return;}
      const precio=moneyVal('wf-precio'); if(!precio){toast('Ingresá el precio de venta','err');return;}
      const comprador=document.getElementById('wf-comprador').value;
      if(!comprador){toast('Ingresá el comprador','err');return;}

      // ── CAPTURAR TODOS LOS VALORES DEL FORMULARIO ANTES de showConfirm ──
      // showConfirm llama a cerrarModal() ANTES del callback, borrando el DOM.
      // Todo lo que necesitemos dentro del callback DEBE capturarse aquí.
      const vehLabel=document.getElementById('wf-vehiculo').options[document.getElementById('wf-vehiculo').selectedIndex]?.text||idVeh;
      const tc_dia=parseFloat(document.getElementById('wf-tc-dia')?.value)||0;
      const vendedorVal=document.getElementById('wf-vendedor')?.value||'';
      const entidadVal=document.getElementById('wf-entidad')?.value||'AGA';
      const veh=VEH_MAP[idVeh]||{};
      const esConsigna=veh.tipo==='Consigna';
      const comisionPct=esConsigna?(parseFloat(document.getElementById('wf-comision-pct')?.value)||5):null;
      const ps=_getPaymentSources(); // leer payment sources AHORA (DOM existe)
      let vehiculo_entrega=0,idAutoPartePago=null;
      if(ps?.auto){vehiculo_entrega=ps.auto.valor||0;idAutoPartePago=ps.auto.id||null;}
      else if(ps?.mix){const comp=ps.mix.find(m=>m.medio==='AUTO');if(comp){vehiculo_entrega=comp.valor||0;idAutoPartePago=comp.id||null;}}
      const detalleVenta=`Venta auto — ${vehLabel}`;

      if(!showConfirm(`¿Confirmar venta?`,
        `Vehículo: <strong>${vehLabel}</strong><br>Comprador: <strong>${comprador}</strong><br>Precio: <strong>${fmtARS(precio)}</strong>${vehiculo_entrega?`<br>Parte de pago (auto): ${fmtARS(vehiculo_entrega)}`:''}`,
        'Confirmar venta',()=>{
          // ── CALLBACK: ya no hay DOM — usar SÓLO las variables capturadas arriba ──
          const d2={...data,id_vehiculo:idVeh,precio_venta:precio,comprador,
            vendedor:vendedorVal,
            efectivo:ps?.ars||ps?.mix?.find(m=>m.medio==='ARS')?.ars||0,
            vehiculo_entrega,id_auto_parte_pago:idAutoPartePago,
            financiacion:0,tc_dia,debe:precio,
            comision_pct:comisionPct,es_ingreso:true,
            detalle:detalleVenta,concepto:'Venta Auto',entidad:entidadVal};
          if(ps)d2.payment_sources=ps;
          google.script.run
            .withSuccessHandler(r=>{
              if(r.ok){
                toast(`Venta registrada · Ganancia: ${fmtARS(r.ganancia||0)}`,'ok');
                loadMovimientos();loadBalances();dashLoaded=false;loadCajaTab(CAJA_TAB);loadInventario(INV_FILTRO);
              }else toast(r.error||'Error al guardar la venta','err');
            })
            .withFailureHandler(e=>{toast('Error de conexión: '+(e?.message||''),'err');})
            .saveMovimientoCajaCompleto(d2);
        },'warn')) return;
      return;
    }
    else if(WZ.concepto==='gasto_auto'){
      const idVeh=document.getElementById('wf-vehiculo').value; if(!idVeh){toast('Seleccioná un vehículo','err');return;}
      const imp=moneyVal('wf-importe'); if(!imp){toast('Ingresá el importe','err');return;}
      const desc=document.getElementById('wf-desc').value; if(!desc){toast('Ingresá una descripción','err');return;}
      Object.assign(data,{id_vehiculo:idVeh,categoria:document.getElementById('wf-cat-gv').value,
        descripcion:desc,proveedor:document.getElementById('wf-prov').value,haber:imp,
        detalle:`${document.getElementById('wf-cat-gv').value}: ${desc}`,concepto:'Reparación Vehículo'});
    }
    else if(WZ.concepto==='gasto_agencia'){
      const prov=document.getElementById('wf-prov-ga').value; if(!prov){toast('Ingresá el proveedor','err');return;}
      const neto=moneyVal('wf-neto'); if(!neto){toast('Ingresá el neto','err');return;}
      const total=moneyVal('wf-total')||neto;
      Object.assign(data,{categoria:document.getElementById('wf-cat-ga').value,
        tipo:document.getElementById('wf-tipo-ga').value,proveedor:prov,
        descripcion:document.getElementById('wf-desc-ga').value,
        neto,iva:moneyVal('wf-iva'),total,canal:document.getElementById('wf-canal').value,
        haber:total,detalle:`${document.getElementById('wf-cat-ga').value}: ${prov}`,concepto:document.getElementById('wf-cat-ga').value});
    }
    else if(WZ.concepto==='cobro_cheque'||WZ.concepto==='pago_cheque'){
      const imp=moneyVal('wf-chq-importe'); if(!imp){toast('Ingresá el importe del cheque','err');return;}
      const vto=document.getElementById('wf-vto').value; if(!vto){toast('Ingresá la fecha de vencimiento','err');return;}
      const esC=WZ.concepto==='cobro_cheque';
      Object.assign(data,{numero:document.getElementById('wf-chq-num').value,banco:document.getElementById('wf-banco').value,
        librador:document.getElementById('wf-librador').value,beneficiario:document.getElementById('wf-librador').value,
        importe:imp,fecha_vto:vto,
        debe:esC?imp:0,haber:esC?0:imp,
        detalle:`${esC?'Cobro':'Pago'} cheque #${document.getElementById('wf-chq-num').value||'?'}`,
        concepto:esC?'Cobro Cheque':'Pago Cheque'});
    }
    else if(WZ.concepto==='venta_usd'||WZ.concepto==='compra_usd'){
      const usd=parseFloat(document.getElementById('wf-musd').value)||0; if(!usd){toast('Ingresá el monto en USD','err');return;}
      const tc=parseFloat(document.getElementById('wf-tc').value)||0; if(!tc){toast('Ingresá el tipo de cambio','err');return;}
      const ars=moneyVal('wf-mars')||Math.round(usd*tc); const esV=WZ.concepto==='venta_usd';
      Object.assign(data,{monto_usd:usd,tc,monto_ars:ars,tc_dia:tc,
        contraparte:document.getElementById('wf-contraparte').value,
        debe:esV?ars:0,haber:esV?0:ars,
        detalle:`${esV?'Venta':'Compra'} USD ${usd} × ${fmt(tc)}`,concepto:esV?'Venta USD':'Compra USD'});
    }
    else if(WZ.concepto==='reg_usd_ing'||WZ.concepto==='reg_usd_eg'){
      const usd=parseFloat(document.getElementById('wf-musd').value)||0; if(!usd){toast('Ingresá el monto en USD','err');return;}
      const tc=parseFloat(document.getElementById('wf-tc').value)||0; if(!tc){toast('Ingresá el TC','err');return;}
      const ars=moneyVal('wf-mars')||Math.round(usd*tc); const esIng=WZ.concepto==='reg_usd_ing';
      const desc=document.getElementById('wf-desc-gen')?.value||'';
      Object.assign(data,{monto_usd:usd,tc,monto_ars:ars,tc_dia:tc,
        contraparte:document.getElementById('wf-contraparte')?.value||'',
        debe:esIng?ars:0,haber:esIng?0:ars,
        detalle:desc||(esIng?`Cobro en USD ${usd}`:`Pago en USD ${usd}`),
        concepto:esIng?'Cobro USD':'Pago USD'});
    }
    else if(WZ.concepto==='compra_auto'){
      const imp=moneyVal('wf-importe'); if(!imp){toast('Ingresá el precio de compra','err');return;}
      const dominio=(document.getElementById('wf-dominio')?.value||'').toUpperCase().trim();
      if(!dominio) return fieldError('wf-dominio','Ingresá el dominio del vehículo');
      const marca=document.getElementById('wf-marca')?.value;
      if(!marca) return fieldError('wf-marca','Seleccioná la marca');
      const modelo=document.getElementById('wf-modelo')?.value||'';
      if(!modelo) return fieldError('wf-modelo','Ingresá el modelo');
      const anio=parseInt(document.getElementById('wf-anio')?.value)||0;
      if(!anio) return fieldError('wf-anio','Ingresá el año');
      const tipo=document.getElementById('wf-tipo-veh')?.value||'Usado';
      const precioTabla=moneyVal('wf-precio-tabla')||0;
      const entidadSel=document.getElementById('wf-entidad')?.value||'AGA';
      const esMartin=entidadSel==='Martin'; // automático por entidad seleccionada
      const exDueno=esMartin?'Martin':document.getElementById('wf-exdueno')?.value||'';
      const descAuto=`Compra ${marca} ${modelo} ${anio} (${dominio})${esMartin?' [Martín]':''}`;
      const vehData={dominio,marca,modelo:modelo,anio,tipo,precio_toma:imp,precio_tabla:precioTabla,
        markup_consigna:tipo==='Consigna'?1.30:0,
        ex_dueno_nombre:exDueno,fecha_ingreso:hoy,registrar_caja:false};
      Object.assign(data,{haber:imp,debe:0,detalle:descAuto,concepto:'Compra Auto',
        entidad:entidadSel,
        _veh_data:vehData});
    }
    else{
      const imp=moneyVal('wf-importe'); if(!imp){toast('Ingresá el importe','err');return;}
      const desc=document.getElementById('wf-desc-gen')?.value||'';
      if(!desc){toast('Ingresá una descripción','err');return;}
      const esIng=WZ.tipo==='ingreso';
      Object.assign(data,{debe:esIng?imp:0,haber:esIng?0:imp,detalle:desc,concepto:desc});
    }

    // Parte en USD (opcional, cualquier movimiento)
    const usdToggle=document.getElementById('wf-usd-toggle');
    if(usdToggle?.checked){
      const pusd=parseFloat(document.getElementById('wf-pusd')?.value)||0;
      const ptc=parseFloat(document.getElementById('wf-ptc')?.value)||0;
      if(pusd&&ptc){data.usd_monto=pusd;data.usd_tc=ptc;}
    }

    // Entidad (AGA o Martin)
    data.entidad = document.getElementById('wf-entidad')?.value || ENTIDAD_ACTUAL;

    // Payment sources (origen del pago para egresos)
    const payS = _getPaymentSources();
    if(payS) data.payment_sources = payS;

    const btn=document.getElementById('wz-guardar'); if(btn){btn.disabled=true; btn.textContent='Guardando...';}

    // compra_auto: primero crear el vehículo, luego el movimiento de caja
    if(data._veh_data){
      const vehData = data._veh_data; delete data._veh_data;
      const esConsigna = vehData.tipo === 'Consigna';
      google.script.run
        .withSuccessHandler(vehR=>{
          if(!vehR?.ok){toast(vehR?.error||'Error creando el vehículo','err');btn.disabled=false;btn.textContent='Guardar movimiento';return;}
          if(esConsigna){
            // Consigna: solo registrar el vehículo, NO crear egreso en caja
            cerrarModal();
            toast(`🚗 Auto en consigna registrado — no se registra egreso`,'ok');
            loadInventario(INV_FILTRO);dashLoaded=false;
            return;
          }
          // Compra normal: registrar el egreso en caja
          data.referencia=`VEH:${vehR.id}`;
          google.script.run
            .withSuccessHandler(r=>{
              if(r.ok){cerrarModal();toast(`Auto registrado en inventario y caja actualizada`,'ok');loadMovimientos();loadBalances();dashLoaded=false;loadInventario(INV_FILTRO);loadCajaTab(CAJA_TAB);}
              else{toast(r.error||'Error al guardar caja','err');btn.disabled=false;btn.textContent='Guardar movimiento';}
            })
            .withFailureHandler(()=>{toast('Error','err');btn.disabled=false;btn.textContent='Guardar movimiento';})
            .saveMovimientoCajaCompleto(data);
        })
        .withFailureHandler(()=>{toast('Error al crear vehículo','err');btn.disabled=false;btn.textContent='Guardar movimiento';})
        .saveVehiculo(vehData);
      return;
    }

    google.script.run
      .withSuccessHandler(r=>{
        if(r.ok){
          cerrarModal();
          const msgs={venta_auto:`Venta registrada · Ganancia: ${fmtARS(r.ganancia||0)}`,gasto_auto:'Gasto en vehículo guardado',gasto_agencia:'Gasto de agencia guardado',cobro_cheque:'Cheque en cartera',pago_cheque:'Cheque emitido',venta_usd:'Venta USD registrada',compra_usd:'Compra USD registrada',reg_usd_ing:'Cobro en USD registrado',reg_usd_eg:'Pago en USD registrado'};
          toast(msgs[WZ.concepto]||'Movimiento guardado','ok');
          loadMovimientos();loadBalances();dashLoaded=false;
          // Refrescar el tab activo (una sola llamada para evitar race condition)
          loadCajaTab(CAJA_TAB);
          // Refrescar cheques si hubo cheque en el movimiento (egreso O ingreso nuevo)
          if(WZ.concepto==='cobro_cheque'||WZ.concepto==='pago_cheque'||
             payS?.cheques||payS?.chq_nuevo||
             payS?.mix?.some(m=>m.medio==='CHQ')) {
            loadCheques('');
            toast('Movimiento guardado · Cheque registrado en cartera','ok');
          }
        }else{toast(r.error||'Error al guardar','err');btn.disabled=false;btn.textContent='Guardar movimiento';}
      })
      .withFailureHandler(e=>{toast('Error','err');btn.disabled=false;btn.textContent='Guardar movimiento';})
      .saveMovimientoCajaCompleto(data);
  }catch(err){toast('Error: '+err.message,'err');}
}

// Autocomplete
function acBuscar(input,listId){const q=input.value;const list=document.getElementById(listId);if(q.length<2){list.style.display='none';return;}google.script.run.withSuccessHandler(r=>{if(!r.length){list.style.display='none';return;}list.style.display='';list.innerHTML=r.map(n=>`<div class="ac-item" onclick="acSelect('${input.id}','${listId}','${n.replace(/'/g,"\\'")}')">${n}</div>`).join('');}).buscarPersonas(q);}
function acSelect(inputId,listId,val){document.getElementById(inputId).value=val;document.getElementById(listId).style.display='none';}

function initConfigPage(){
  const cfg=UI_CFG;
  if(cfg.accent){document.getElementById('cfg-accent').value=cfg.accent;document.documentElement.style.setProperty('--accent',cfg.accent);}
  if(cfg.brand){document.getElementById('cfg-brand').value=cfg.brand;document.documentElement.style.setProperty('--brand',cfg.brand);}
  if(cfg.fontSize){const el=document.getElementById('font-size-val');if(el)el.textContent=cfg.fontSize+'px';document.documentElement.style.setProperty('--fs',cfg.fontSize+'px');}
  if(cfg.font){const el=document.getElementById('cfg-font');if(el)el.value=cfg.font;}
  if(cfg.radius){const el=document.getElementById('cfg-radius');if(el)el.value=cfg.radius;document.documentElement.style.setProperty('--r',cfg.radius+'px');document.documentElement.style.setProperty('--rs',Math.max(0,cfg.radius-4)+'px');}
  // Column toggles
  document.querySelectorAll('.col-toggle input').forEach(cb=>{
    const table=cb.dataset.table,col=cb.dataset.col;
    const key=`cols_${table}`;
    if(UI_CFG[key]&&UI_CFG[key][col]===false) cb.checked=false;
  });
}
function applyStoredUI(){
  const cfg=UI_CFG;
  if(cfg.accent) document.documentElement.style.setProperty('--accent',cfg.accent);
  if(cfg.brand)  document.documentElement.style.setProperty('--brand',cfg.brand);
  if(cfg.fontSize) document.documentElement.style.setProperty('--fs',cfg.fontSize+'px');
  if(cfg.radius){document.documentElement.style.setProperty('--r',cfg.radius+'px');document.documentElement.style.setProperty('--rs',Math.max(0,cfg.radius-4)+'px');}
  if(cfg.font) document.documentElement.style.setProperty('--font',cfg.font);
}
function applyPreset(btn){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  const accent=btn.dataset.accent,brand=btn.dataset.brand;
  document.getElementById('cfg-accent').value=accent;document.getElementById('cfg-brand').value=brand;
  previewColor(accent);previewBrand(brand);
}
function previewColor(v){document.documentElement.style.setProperty('--accent',v);document.documentElement.style.setProperty('--accent-l',v+'22');}
function previewBrand(v){document.documentElement.style.setProperty('--brand',v);}
let _curFontSize=parseInt(UI_CFG.fontSize)||14;
function changeFontSize(d){_curFontSize=Math.max(12,Math.min(18,_curFontSize+d));document.documentElement.style.setProperty('--fs',_curFontSize+'px');document.getElementById('font-size-val').textContent=_curFontSize+'px';}
function applyFont(v){document.documentElement.style.setProperty('--font',v);}
function applyRadius(v){document.documentElement.style.setProperty('--r',v+'px');document.documentElement.style.setProperty('--rs',Math.max(0,parseInt(v)-4)+'px');}

function guardarConfig(){
  const cols_inv={},cols_caja={};
  document.querySelectorAll('.col-toggle input[data-table=inv]').forEach(cb=>{cols_inv[cb.dataset.col]=cb.checked;});
  document.querySelectorAll('.col-toggle input[data-table=caja]').forEach(cb=>{cols_caja[cb.dataset.col]=cb.checked;});
  UI_CFG={
    accent:document.getElementById('cfg-accent').value,
    brand:document.getElementById('cfg-brand').value,
    fontSize:_curFontSize,
    font:document.getElementById('cfg-font').value,
    radius:parseInt(document.getElementById('cfg-radius').value),
    cols_inv,cols_caja
  };
  localStorage.setItem('aga_ui',JSON.stringify(UI_CFG));
  applyStoredUI();
  toast('Configuración guardada','ok');
}

let _reporteLoaded = null;
function loadReportes() {
  const selMes = document.getElementById('rep-mes');
  const selAnio = document.getElementById('rep-anio');
  if (!selMes) return;
  const mes = selMes.value, anio = selAnio.value;
  if (_reporteLoaded === mes+anio) return;
  _reporteLoaded = mes+anio;
  document.getElementById('rep-body').innerHTML = `<div style="text-align:center;padding:60px;color:var(--t3)">Calculando...</div>`;
  google.script.run.withSuccessHandler(renderReporte).withFailureHandler(()=>toast('Error al cargar','err')).getReporteMensual(mes,anio);
}
function recargarReporte(){ _reporteLoaded=null; loadReportes(); }

function renderReporte(d) {
  if (!d?.ok) { document.getElementById('rep-body').innerHTML=`<p style="color:var(--err);padding:20px">Error: ${d?.error||'Desconocido'}</p>`; return; }
  const delta = d.resultado-d.prev_neto, deltaSign = delta>=0?'+':'';
  const pctDelta = d.prev_neto?Math.abs(((delta/d.prev_neto)*100)).toFixed(0):'—';
  const tiposHtml = Object.entries(d.ventas.porTipo||{}).map(([t,v])=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f3f4f6">
      <span class="badge badge-${t.toLowerCase()}">${t}</span>
      <span style="font-size:12px;color:var(--t2)">${v.count} auto${v.count!==1?'s':''}</span>
      <span style="font-size:13px;font-weight:600">${fmtARS(v.ganancia)}</span>
    </div>`).join('');
  const gastoCats = Object.entries(d.gastosAgencia.porCategoria||{})
    .sort(([,a],[,b])=>b-a);
  const gastoRows = gastoCats.map(([cat,total])=>{
    const pctG = d.gastosAgencia.total?((total/d.gastosAgencia.total)*100).toFixed(0):0;
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f3f4f6">
      <span style="flex:1;font-size:13px">${cat}</span>
      <div style="width:80px;background:#f3f4f6;border-radius:4px;height:6px;overflow:hidden"><div style="width:${pctG}%;background:var(--err);height:100%;border-radius:4px"></div></div>
      <span style="font-size:11px;color:var(--t3);width:30px;text-align:right">${pctG}%</span>
      <span style="font-size:13px;font-weight:600;width:90px;text-align:right">${fmtARS(total)}</span>
    </div>`;}).join('');

  document.getElementById('rep-body').innerHTML = `
    <!-- KPIs Row 1 -->
    <div class="rep-kpis">
      <div class="rep-kpi"><div class="rep-kpi-lbl">Ventas</div><div class="rep-kpi-val">${d.ventas.count}</div><div class="rep-kpi-sub">autos vendidos</div></div>
      <div class="rep-kpi"><div class="rep-kpi-lbl">Ingresos brutos</div><div class="rep-kpi-val" style="color:var(--ok)">${fmtARS(d.ventas.total)}</div><div class="rep-kpi-sub">precio total de ventas</div></div>
      <div class="rep-kpi"><div class="rep-kpi-lbl">Ganancia bruta</div><div class="rep-kpi-val" style="color:var(--accent)">${fmtARS(d.ventas.ganancia)}</div><div class="rep-kpi-sub">margen ${d.ventas.margen}% sobre costo</div></div>
      <div class="rep-kpi"><div class="rep-kpi-lbl">Gastos agencia</div><div class="rep-kpi-val" style="color:var(--err)">${fmtARS(d.gastosAgencia.total)}</div><div class="rep-kpi-sub">${d.gastosAgencia.count} comprobantes</div></div>
      <div class="rep-kpi rep-kpi-resultado ${d.resultado>=0?'pos':'neg'}">
        <div class="rep-kpi-lbl">Resultado neto</div>
        <div class="rep-kpi-val">${fmtARS(d.resultado)}</div>
        <div class="rep-kpi-sub">${delta!==0?`${deltaSign}${fmtARS(delta)} vs mes ant. (${deltaSign}${pctDelta}%)`:'Sin comparación'}</div>
      </div>
    </div>

    <!-- KPIs Row 2 — Indicadores operativos -->
    <div class="rep-kpis" style="margin-top:10px">
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">🏷️ Costo de comercialización</div>
        <div class="rep-kpi-val" style="color:var(--warn)">${d.costoComercializacion!==null?fmtARS(d.costoComercializacion):'—'}</div>
        <div class="rep-kpi-sub">por auto vendido · gastos agencia ÷ ventas</div>
      </div>
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">🔄 Rotación de stock</div>
        <div class="rep-kpi-val" style="color:var(--accent)">${d.rotacionDias!==null?d.rotacionDias+'d':'—'}</div>
        <div class="rep-kpi-sub">promedio días en stock antes de venderse</div>
      </div>
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">📦 Stock actual</div>
        <div class="rep-kpi-val">${d.stockCount}</div>
        <div class="rep-kpi-sub">autos en inventario · ${fmtARS(d.stockValue)} en costo</div>
      </div>
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">💵 Precio prom. venta</div>
        <div class="rep-kpi-val">${d.ventas.count?fmtARS(d.ventas.promPrecio):'—'}</div>
        <div class="rep-kpi-sub">precio promedio del período</div>
      </div>
      <div class="rep-kpi">
        <div class="rep-kpi-lbl">💰 Posición USD</div>
        <div class="rep-kpi-val" style="color:${d.posUSD>=0?'var(--ok)':'var(--err)'}">${d.posUSD>=0?'+':''}${d.posUSD.toFixed(2)} USD</div>
        <div class="rep-kpi-sub">posición neta acumulada en dólares</div>
      </div>
    </div>

    <div class="rep-grid">
      <!-- Ventas por tipo -->
      <div class="rep-card">
        <h3 class="rep-card-title">Ventas por tipo de vehículo</h3>
        ${tiposHtml||`<p style="color:var(--t3);font-size:13px;text-align:center;padding:20px 0">Sin ventas en el período</p>`}
        ${d.ventas.count?`<div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:4px;font-weight:600;font-size:13px"><span>Total</span><span>${fmtARS(d.ventas.ganancia)}</span></div>`:''}

        ${d.gastosAgencia.total?`<div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:4px;font-weight:600;font-size:13px"><span>Total</span><span style="color:var(--err)">${fmtARS(d.gastosAgencia.total)}</span></div>`:''}

      <!-- Ventas del mes -->

        `<table class="data-table"><thead><tr><th>Fecha</th><th>Vehículo</th><th>Comprador</th><th class="num">Precio</th><th class="num">Costo</th><th class="num" style="color:var(--ok)">Ganancia</th><th class="num">Margen</th></tr></thead><tbody>

          <div style="border-top:2px solid var(--bord);padding-top:8px;display:flex;justify-content:space-between;font-size:15px;font-weight:700"><span>Flujo neto</span><span style="color:${d.cajaDebe-d.cajaHaber>=0?'var(--ok)':'var(--err)'}">${fmtARS(d.cajaDebe-d.cajaHaber)}</span></div>
        </div>
      </div>

      <!-- Posición USD -->
      <div class="rep-card">
        <h3 class="rep-card-title">Posición en dólares</h3>
        <div style="text-align:center;padding:16px 0">
          <div style="font-size:32px;font-weight:700;color:${d.posUSD>=0?'var(--ok)':'var(--err)'}">${d.posUSD>=0?'+':''}${d.posUSD.toFixed(2)} USD</div>
          <div style="font-size:12px;color:var(--t3);margin-top:4px">posición neta acumulada</div>
        </div>
      </div>
    </div>`;
}

function cerrarModal(){document.getElementById('modal-overlay').classList.remove('open');document.body.style.overflow='';}

function fmtARS(n){if(n===null||n===undefined)return'—';const v=Number(n);if(v>=1e6)return'$ '+(v/1e6).toFixed(1)+'M';if(v>=1e3)return'$ '+Math.round(v/1e3)+'K';return'$ '+fmt(v);}
function fmt(n){return new Intl.NumberFormat('es-AR').format(Math.round(n));}
function pct(a,b){return b?((a/b)*100).toFixed(1):'—';}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function isoDate(d){if(!d)return'';const p=d.split('/');return p.length===3?`${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`:d;}
function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='show '+(type||'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',3500);}
</script>
